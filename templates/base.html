<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="{% static 'qstylesheet.css' %}">

    {% block css_extra %}{% endblock %}
    <title>{% block title %}Controle de Horas{% endblock %}</title>
</head>

<body>
    <div id="topbar">
        {% block topbar %}

        {% if user.is_authenticated %}
            <a href="{% url 'horas:dashboard' %}">Dashboard</a>
            <form method="POST" action="{% url 'contas:logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% endif %}
        
        {% endblock %}
    </div>

    <div id="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
